<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Identity</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="wrap" style="max-width:1080px">

  <div id="gate">
    <h3 style="margin-bottom:8px">Admin</h3>
    <p class="mono muted" style="font-size:11px;margin-bottom:24px">operator access · every action here is on real accounts</p>
    <div class="field" style="max-width:320px;margin-bottom:12px">
      <label for="pw">Password</label>
      <input id="pw" type="password" class="input" autocomplete="current-password">
    </div>
    <p class="err" id="gate-err" hidden style="margin-bottom:12px"></p>
    <button class="btn btn-primary" id="signin">Sign in</button>
  </div>

  <div id="panel" hidden>
    <div style="display:flex;align-items:baseline;gap:24px;margin-bottom:24px;flex-wrap:wrap">
      <h3 style="margin:0">Admin</h3>
      <button class="btn btn-ghost" data-tab="users" id="tab-users">Users</button>
      <button class="btn btn-ghost" data-tab="devs" id="tab-devs">Developers</button>
      <button class="btn btn-ghost" data-tab="ops" id="tab-ops">Operations</button>
      <button class="btn btn-secondary" id="signout" style="margin-left:auto">Sign out</button>
    </div>

    <section id="view-users">
      <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:24px">
        <div class="field" style="flex:1;max-width:320px">
          <label for="q">Search by email</label>
          <input id="q" class="input" placeholder="name@example.org">
        </div>
        <button class="btn btn-secondary" id="search">Search</button>
      </div>
      <div id="users"></div>
      <div id="pager" style="display:flex;gap:12px;align-items:center;justify-content:center;margin-top:24px"></div>
    </section>

    <section id="view-devs" hidden>
      <div id="devs"></div>
    </section>

    <section id="view-ops" hidden>
      <div id="ops-storage" style="margin-bottom:32px"></div>
      <div id="ops-drills" style="margin-bottom:32px"></div>
      <div id="ops-errors"></div>
      <div id="ops-runs" style="margin-top:32px"></div>
    </section>

    <div id="detail" hidden style="border:2px solid var(--pb-blue);padding:24px;margin-top:24px"></div>
  </div>
</div>
<script src="/static/app.js"></script>
<script src="/static/consent.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let page = 0, query = "";

async function boot() {
  try { await api("/v1/admin/session"); show(); }
  catch (_) { $("gate").hidden = false; }
}

function show() {
  $("gate").hidden = true;
  $("panel").hidden = false;
  loadUsers();
}

$("signin").addEventListener("click", async () => {
  $("gate-err").hidden = true;
  const done = withSpinner($("signin"), "Signing in");
  try {
    await api("/v1/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value }),
    });
    $("pw").value = "";
    show();
  } catch (e) {
    $("gate-err").textContent = e.message;
    $("gate-err").hidden = false;
  } finally { done(); }
});

$("signout").addEventListener("click", async () => {
  await api("/v1/admin/logout", { method: "POST" });
  location.reload();
});

$("tab-users").addEventListener("click", () => { onlyView("view-users"); });
function onlyView(id) {
  for (const v of ["view-users", "view-devs", "view-ops"]) $(v).hidden = v !== id;
  $("detail").hidden = true;
}
$("tab-devs").addEventListener("click", () => { onlyView("view-devs"); loadDevs(); });
$("tab-ops").addEventListener("click", () => { onlyView("view-ops"); loadOps(); });
$("search").addEventListener("click", () => { query = $("q").value.trim(); page = 0; loadUsers(); });

async function loadUsers() {
  const r = await api(`/v1/admin/users?q=${encodeURIComponent(query)}&page=${page}`);
  $("users").innerHTML = r.users.map(u => `
    <div style="border:1px solid rgba(32,30,29,.4);padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <p style="font-size:14px;font-weight:700;margin:0 0 4px">${u.name || "(no name)"}</p>
        <p class="mono muted" style="font-size:10.5px;margin:0;overflow-wrap:anywhere">${u.email} ·
          ${u.codes} codes · ${u.api_keys} keys ·
          ${u.google_linked ? "google linked" : "password only"} ·
          joined ${u.created_at.slice(0,10)}</p>
      </div>
      <button class="btn btn-ghost" data-open="${u.user_id}">Open</button>
      <button class="btn btn-secondary" data-del="${u.user_id}" data-email="${u.email}"
              style="border-color:var(--pb-revoked);color:var(--pb-revokedInk)">Delete</button>
    </div>`).join("") || `<p class="mono muted" style="font-size:11px">no users match</p>`;

  const pages = Math.max(1, Math.ceil(r.total / r.per_page));
  $("pager").innerHTML = pages > 1 ? `
    <button class="btn btn-secondary" id="prev" ${page === 0 ? "disabled" : ""}>Previous</button>
    <span class="mono muted" style="font-size:11px">page ${page + 1} of ${pages} · ${r.total} users</span>
    <button class="btn btn-secondary" id="next" ${page >= pages - 1 ? "disabled" : ""}>Next</button>` : "";
  if (pages > 1) {
    $("prev").onclick = () => { page--; loadUsers(); };
    $("next").onclick = () => { page++; loadUsers(); };
  }

  $("users").querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => openUser(b.dataset.open)));
  $("users").querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", async () => {
      const ok = await confirmAction({
        title: "Delete this account?",
        body: `Everything belonging to ${b.dataset.email} is removed and cannot be `
            + `recovered. Codes already shared will report that they have been `
            + `switched off.`,
        confirmLabel: "Delete", destructive: true, requireText: "DELETE",
      });
      if (!ok) return;
      try {
        await api(`/v1/admin/users/${b.dataset.del}?confirm=DELETE`, { method: "DELETE" });
        toast("Account deleted");
        loadUsers();
      } catch (e) { toast(e.message); }
    }));
}

async function openUser(id) {
  const u = await api(`/v1/admin/users/${id}`);
  $("detail").hidden = false;
  $("detail").innerHTML = `
    <p class="kicker">account</p>
    <p style="font-size:16px;font-weight:700;margin:0 0 4px">${u.name || "(no name)"}</p>
    <p class="mono muted" style="font-size:11px;margin:0 0 16px">${u.email} · ${u.user_id}</p>
    <p class="mono muted" style="font-size:11px;margin:0 0 16px">what their codes open is
      encrypted and the keys never reach this server — there is nothing here to read</p>
    <p class="kicker">codes</p>
    <div class="mono" style="font-size:11px;line-height:1.9;margin-bottom:16px">
      ${u.codes.map(c => `<div>${c.opaque_resolution_id} · ${c.label || "unlabelled"} · ${c.state} · ${c.scan_count} scans</div>`).join("") || "<div>none</div>"}
    </div>
    <p class="kicker">keys</p>
    <div class="mono" style="font-size:11px;line-height:1.9">
      ${u.keys.map(k => `<div>${k.key_id} · ${k.call_count} calls${k.revoked ? " · revoked" : ""}</div>`).join("") || "<div>none</div>"}
    </div>`;
}

async function loadDevs() {
  const r = await api("/v1/admin/developers");
  $("devs").innerHTML = r.developers.map(d => `
    <div style="border:1px solid rgba(32,30,29,.4);padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <p class="mono" style="font-size:12px;font-weight:700;margin:0 0 4px;overflow-wrap:anywhere">${d.key_id}</p>
        <p class="mono muted" style="font-size:10.5px;margin:0;overflow-wrap:anywhere">${d.email} ·
          ${d.name || "unnamed"} · ${d.scopes.join(" ")} ·
          ${d.calls_total} calls total · ${d.calls_today} today${d.rejected_today ? " · " + d.rejected_today + " refused today" : ""}${d.revoked ? " · revoked" : ""}</p>
      </div>
      ${d.revoked ? "" : `<button class="btn btn-secondary" data-kill="${d.key_id}">Revoke key</button>`}
    </div>`).join("") || `<p class="mono muted" style="font-size:11px">no keys have been created</p>`;

  $("devs").querySelectorAll("[data-kill]").forEach(b =>
    b.addEventListener("click", async () => {
      const ok = await confirmAction({
        title: "Revoke this key?",
        body: "The integration using it stops working immediately.",
        confirmLabel: "Revoke", destructive: true,
      });
      if (!ok) return;
      await api(`/v1/admin/keys/${b.dataset.kill}`, { method: "DELETE" });
      toast("Key revoked");
      loadDevs();
    }));
}

/* ── operations ───────────────────────────────────────────────────────────── */

const BYTES = (n) => {
  if (!n) return "0 B";
  const u = ["B", "KiB", "MiB", "GiB"];
  let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${u[i]}`;
};

/* "never" is the honest answer for a drill nobody has run, and the useful one.
   A dash would read as "fine". */
const AGE = (run) => {
  if (!run) return "never run";
  const h = run.age_hours;
  const when = h == null ? "" : h < 1 ? `${Math.round(h * 60)} min ago`
    : h < 48 ? `${h.toFixed(1)} h ago` : `${(h / 24).toFixed(1)} days ago`;
  return `${run.ok ? "passed" : "FAILED"} · ${when}`;
};

let errPage = 1, runPage = 1;

async function loadOps() {
  const o = await api("/v1/admin/ops");
  const s = o.storage;

  const bar = Math.min(100, (s.fraction_used || 0) * 100);
  $("ops-storage").innerHTML = `
    <p class="kicker">photo storage</p>
    <p style="font-size:14px;margin:0 0 8px">
      ${BYTES(s.bytes)} of ${BYTES(s.ceiling_bytes)} · ${s.objects} objects ·
      ${s.backend}${s.average_bytes ? ` · ${BYTES(s.average_bytes)} average` : ""}</p>
    <div style="height:8px;background:rgba(32,30,29,.15);margin-bottom:8px">
      <div style="height:8px;width:${bar.toFixed(2)}%;background:var(${
        s.full ? "--pb-revokedInk" : s.warn ? "--pb-expiringInk" : "--pb-accent"})"></div>
    </div>
    <p class="mono muted" style="font-size:10.5px;margin:0 0 12px">
      ${s.figure_is_fresh ? "" : "figure is stale — the bucket could not be measured · "}
      ${s.rows_in_object_storage} of ${s.photo_rows} photo rows in object storage${
        s.rows_still_in_database ? ` · ${s.rows_still_in_database} still carrying bytes in the database` : ""}
      ${s.full ? " · FULL: new codes are being refused" : s.warn ? " · past 80% of the ceiling" : ""}</p>
    ${s.migration_complete ? "" :
      `<button class="btn btn-secondary" id="do-migrate">Move ${
        Math.min(50, s.rows_still_in_database)} photos to object storage</button>`}`;

  if ($("do-migrate")) $("do-migrate").onclick = async (e) => {
    const done = withSpinner(e.target, "Moving");
    try {
      const r = await api("/v1/admin/ops/migrate-photos?limit=50", { method: "POST" });
      toast(`Moved ${r.moved}, ${r.remaining} left${r.failed.length ? `, ${r.failed.length} failed` : ""}`);
      loadOps();
    } catch (err) { toast(err.message); } finally { done(); }
  };

  const rb = o.rollback || {};
  const drills = [
    { key: "backup", title: "Backup", path: "/v1/admin/ops/backup",
      label: "Run backup", verb: "Backing up",
      note: `${(o.backups || []).length} kept off-database · ${
        (o.last || {}).backup?.detail?.encrypted === false
          ? "UNENCRYPTED — no backup key is configured"
          : (o.last || {}).backup?.detail?.encrypted
            ? "encrypted at rest" : "encryption status unknown until the first run"}`,
      confirm: null },
    { key: "restore", title: "Restore drill", path: "/v1/admin/ops/restore-drill",
      label: "Restore the newest backup", verb: "Restoring",
      note: "restores into a scratch database and checks the joins",
      confirm: null },
    { key: "load", title: "Load test", path: "/v1/admin/ops/load-test?requests_n=200&concurrency=10",
      label: "Send 200 requests", verb: "Loading",
      note: "200 requests at 10 at a time, against the public host",
      confirm: { title: "Send load to production?",
                 body: "200 requests will be sent to the live service. It is a "
                     + "small burst, but it is real traffic on real infrastructure.",
                 confirmLabel: "Send" } },
    { key: "rollback", title: "Rollback drill", path: "/v1/admin/ops/rollback-drill",
      label: "Check rollback target", verb: "Checking",
      note: rb.ready ? `would go back to ${rb.rollback_target}`
                     : "checks a previous revision exists — never rolls back by itself",
      confirm: null },
  ];

  $("ops-drills").innerHTML = `<p class="kicker">drills</p>` + drills.map(d => {
    const last = (o.last || {})[d.key];
    return `
    <div style="border:1px solid rgba(32,30,29,.4);padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <p style="font-size:14px;font-weight:700;margin:0 0 4px">${d.title}
          <span class="mono" style="font-size:10.5px;font-weight:400;color:var(${
            !last ? "--pb-muted" : last.ok ? "--pb-ink" : "--pb-revokedInk"})">${AGE(last)}</span></p>
        <p class="mono muted" style="font-size:10.5px;margin:0;overflow-wrap:anywhere">${d.note}</p>
      </div>
      <button class="btn btn-secondary" data-drill="${d.key}">${d.label}</button>
      ${last ? `<button class="btn btn-ghost" data-detail="${d.key}">Detail</button>` : ""}
    </div>`;
  }).join("") + `
    <p class="mono muted" style="font-size:10.5px;margin:0">
      ${rb.command ? `rollback command: ${rb.command}` :
        "no rollback target visible from inside the container — run the drill from a machine with gcloud"}</p>`;

  for (const d of drills) {
    const btn = $("ops-drills").querySelector(`[data-drill="${d.key}"]`);
    btn.onclick = async () => {
      if (d.confirm && !(await confirmAction(d.confirm))) return;
      const done = withSpinner(btn, d.verb);
      try {
        const r = await api(d.path, { method: "POST" });
        toast(`${d.title}: ${r.ok ? "passed" : "failed"} in ${r.duration_ms} ms`);
        loadOps();
      } catch (e) { toast(e.message); } finally { done(); }
    };
    const det = $("ops-drills").querySelector(`[data-detail="${d.key}"]`);
    if (det) det.onclick = () => {
      $("detail").hidden = false;
      $("detail").innerHTML = `<p class="kicker">${d.title} · last run</p>`
        + `<pre class="mono" style="font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0">`
        + JSON.stringify((o.last || {})[d.key], null, 2) + `</pre>`;
      $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
  }

  await loadErrors();
  await loadRuns();
}

async function loadErrors() {
  const r = await api(`/v1/admin/ops/errors?page=${errPage}&per_page=10`);
  const pages = Math.max(1, Math.ceil(r.total / r.per_page));
  $("ops-errors").innerHTML = `<p class="kicker">errors${r.total ? ` · ${r.total} open` : ""}</p>`
    + (r.items.map(e => `
    <div style="border:1px solid var(--pb-revoked);padding:16px;margin-bottom:12px">
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <p style="font-size:14px;font-weight:700;margin:0 0 4px">${e.kind}
            <span class="mono muted" style="font-size:10.5px;font-weight:400">×${e.count} · ${e.where}</span></p>
          <p class="mono" style="font-size:11px;margin:0 0 4px;overflow-wrap:anywhere">${e.message}</p>
          <p class="mono muted" style="font-size:10px;margin:0">first ${e.first_seen?.slice(0,19).replace("T"," ")} · last ${e.last_seen?.slice(0,19).replace("T"," ")}</p>
        </div>
        <button class="btn btn-ghost" data-trace="${e.fingerprint}">Trace</button>
        <button class="btn btn-secondary" data-fixed="${e.fingerprint}">Resolve</button>
      </div>
      <pre class="mono" data-tracebox="${e.fingerprint}" hidden style="font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(32,30,29,.2)">${
        e.stack.replace(/</g, "&lt;")}</pre>
    </div>`).join("")
    || `<p class="mono muted" style="font-size:11px">nothing unhandled since the last resolve</p>`)
    + (pages > 1 ? `<div style="display:flex;gap:12px;align-items:center;justify-content:center">
        <button class="btn btn-secondary" id="err-prev" ${errPage <= 1 ? "disabled" : ""}>Previous</button>
        <span class="mono muted" style="font-size:11px">page ${errPage} of ${pages}</span>
        <button class="btn btn-secondary" id="err-next" ${errPage >= pages ? "disabled" : ""}>Next</button>
      </div>` : "");

  if ($("err-prev")) $("err-prev").onclick = () => { errPage--; loadErrors(); };
  if ($("err-next")) $("err-next").onclick = () => { errPage++; loadErrors(); };
  $("ops-errors").querySelectorAll("[data-trace]").forEach(b => b.onclick = () => {
    const box = $("ops-errors").querySelector(`[data-tracebox="${b.dataset.trace}"]`);
    box.hidden = !box.hidden;
  });
  $("ops-errors").querySelectorAll("[data-fixed]").forEach(b => b.onclick = async () => {
    await api(`/v1/admin/ops/errors/${b.dataset.fixed}/resolve`, { method: "POST" });
    toast("Marked resolved — it comes back if it happens again");
    loadErrors();
  });
}

async function loadRuns() {
  const r = await api(`/v1/admin/ops/runs?page=${runPage}&per_page=10`);
  const pages = Math.max(1, Math.ceil(r.total / r.per_page));
  $("ops-runs").innerHTML = `<p class="kicker">history</p>`
    + `<div class="mono" style="font-size:11px;line-height:1.9">`
    + (r.items.map(x => `<div>${x.at?.slice(0,19).replace("T"," ")} · ${x.kind} · ${
        x.ok ? "passed" : "FAILED"} · ${x.duration_ms} ms</div>`).join("")
       || "<div>nothing has been run yet</div>") + `</div>`
    + (pages > 1 ? `<div style="display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px">
        <button class="btn btn-secondary" id="run-prev" ${runPage <= 1 ? "disabled" : ""}>Previous</button>
        <span class="mono muted" style="font-size:11px">page ${runPage} of ${pages} · ${r.total} runs</span>
        <button class="btn btn-secondary" id="run-next" ${runPage >= pages ? "disabled" : ""}>Next</button>
      </div>` : "");
  if ($("run-prev")) $("run-prev").onclick = () => { runPage--; loadRuns(); };
  if ($("run-next")) $("run-next").onclick = () => { runPage++; loadRuns(); };
}

boot();
</script>
</body>
</html>
