<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Identity by Patience AI</title>
<meta name="description" content="Sign in or create an account for Identity, the photo-bound identity code service by Patience AI.">
<link rel="canonical" href="https://identity.patienceai.in/app/auth.html">
<meta name="robots" content="noindex,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Identity by Patience AI">
<meta property="og:title" content="Sign in — Identity by Patience AI">
<meta property="og:description" content="Sign in or create an account for Identity, the photo-bound identity code service by Patience AI.">
<meta property="og:url" content="https://identity.patienceai.in/app/auth.html">
<meta property="og:image" content="https://identity.patienceai.in/static/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign in — Identity by Patience AI">
<meta name="twitter:description" content="Sign in or create an account for Identity, the photo-bound identity code service by Patience AI.">
<meta name="twitter:image" content="https://identity.patienceai.in/static/icon-512.png">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/icon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/site.webmanifest">
<meta name="theme-color" content="#201e1d">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:42px 24px">
  <div class="code-card" style="--corner:#1F3FB5;width:min(380px,100%)">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span>

    <div id="step-form">
      <h3 id="title" style="margin-bottom:8px">Sign in</h3>
      <p id="blurb" style="font-size:14px;margin-bottom:12px">Welcome back. Your codes are where you left them.</p>
      <div style="display:inline-flex;border:1px solid rgba(32,30,29,.4);margin-bottom:12px">
        <label style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;font-size:13px;cursor:pointer">
          <input type="radio" name="mode" value="signin" checked>Sign in</label>
        <label style="display:inline-flex;align-items:center;gap:6px;padding:8px 12px;font-size:13px;cursor:pointer;border-left:1px solid rgba(32,30,29,.4)">
          <input type="radio" name="mode" value="signup">Sign up</label>
      </div>

      <div class="field" id="f-name" hidden style="margin-bottom:12px">
        <label for="au-name">Name</label>
        <input id="au-name" class="input" placeholder="Ama Osei" autocomplete="name">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label for="au-email">Email</label>
        <input id="au-email" type="email" class="input" placeholder="you@clinic.org" autocomplete="email">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label for="au-pass">Password</label>
        <div class="pw">
          <input id="au-pass" type="password" class="input" placeholder="your password" autocomplete="current-password">
          <button type="button" class="pw-eye" id="eye" aria-label="Show password" aria-pressed="false">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-shut" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          </button>
        </div>
      </div>

      <label id="terms-row" hidden style="display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;margin-bottom:12px">
        <input type="checkbox" id="accept" style="margin-top:3px;flex:none">
        <span>I agree to the <a href="/app/terms.html" target="_blank" rel="noopener">terms of use</a>
          and <a href="/app/privacy.html" target="_blank" rel="noopener">privacy policy</a>.</span>
      </label>

      <p class="err" id="err" hidden style="margin-bottom:12px"></p>
      <button class="btn btn-primary btn-block" id="submit">Sign in</button>

      <div style="display:flex;align-items:center;gap:12px;margin:12px 0">
        <span style="flex:1;height:1px;background:rgba(32,30,29,.4)"></span>
        <span class="mono muted" style="font-size:10px">or</span>
        <span style="flex:1;height:1px;background:rgba(32,30,29,.4)"></span>
      </div>
      <div id="gsi-host" style="min-height:44px"></div>
      <button class="btn btn-secondary btn-block" id="google" hidden>
        <span class="mono" style="font-weight:700;width:20px;height:20px;display:inline-grid;place-items:center;border:1.5px solid rgba(32,30,29,.4)">G</span>Continue with Google</button>
      <p class="mono muted" id="gnote" hidden style="font-size:10.5px;margin:6px 0 0">signing up with Google needs the same agreement above</p>
      <button class="btn-plain mono muted" id="gsi-retry" type="button" style="font-size:11px;margin:6px 0 0;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer">Google sign-in not working? Use the redirect method</button>
      <p class="mono muted" style="font-size:11px;margin:12px 0 0">your payload never touches this account — the key stays in the link</p>
    </div>

    <div id="step-otp" hidden>
      <h3 style="margin-bottom:8px">Check your email</h3>
      <p style="font-size:14px;margin-bottom:12px">We sent a 6-digit code to
        <strong id="otp-email" class="mono" style="font-size:13px"></strong>.
        It expires in <span id="otp-mins">15</span> minutes.</p>
      <div class="field" style="margin-bottom:12px">
        <label for="otp">Verification code</label>
        <input id="otp" class="input mono" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:.3em;text-align:center">
      </div>
      <p class="err" id="otp-err" hidden style="margin-bottom:12px"></p>
      <p class="mono muted" id="otp-dev" hidden style="font-size:10.5px;margin-bottom:12px"></p>
      <button class="btn btn-primary btn-block" id="verify">Verify and create account</button>
      <div style="display:flex;gap:12px;margin-top:12px">
        <button class="btn btn-ghost" id="resend">Send a new code</button>
        <button class="btn btn-ghost" id="back">Use a different email</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
<script src="/static/consent.js"></script>
<script src="/static/chrome.js"></script>
<script src="/static/download.js"></script>
<script src="/static/legal.js"></script>
<script src="/static/feedback.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/auth.js"></script>
<script src="/static/sync.js"></script>
</body>
</html>
