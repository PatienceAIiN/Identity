<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your codes — Identity by Patience AI</title>
<meta name="description" content="Manage your photo-bound codes: revoke a share, read its scan log, open its public page.">
<link rel="canonical" href="https://identity.patienceai.in/app/codes.html">

<meta property="og:title" content="Your codes — Identity by Patience AI">
<meta property="og:description" content="Manage your photo-bound codes: revoke a share, read its scan log, open its public page.">
<meta property="og:url" content="https://identity.patienceai.in/app/codes.html">
<meta property="og:image" content="https://identity.patienceai.in/static/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your codes — Identity by Patience AI">
<meta name="twitter:description" content="Manage your photo-bound codes: revoke a share, read its scan log, open its public page.">
<meta name="twitter:image" content="https://identity.patienceai.in/static/icon-512.png">

<link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/icon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/site.webmanifest">

<link rel="stylesheet" href="/static/styles.css">

</head>
<body data-requires-auth="1">
<nav class="nav">
  <a class="nav-brand" href="/">Identity</a>
  <a href="/app/codes.html" aria-current="page">Codes</a>
  <a href="/app/new.html">New code</a>
  <a href="/app/scan.html">Scan</a>
  <a href="/app/usage.html">Usage</a>
  <a href="/app/profile.html">Profile</a>
</nav>
<div class="wrap">
  <div style="display:flex;align-items:baseline;gap:24px;margin-bottom:42px">
    <h3 style="margin:0">Your codes</h3>
    <span class="mono muted" id="count" style="font-size:11px"></span>
    <a class="btn btn-primary" style="margin-left:auto" href="/app/new.html">New code</a>
  </div>
  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px"></div>
  <p class="mono muted" id="empty" hidden style="font-size:11px">no codes yet — make one from “New code”</p>
  <div id="pager" hidden style="display:flex;gap:12px;align-items:center;justify-content:center;margin-top:24px"></div>
</div>
<script src="/static/app.js"></script>
<script src="/static/consent.js"></script>
<script src="/static/chrome.js"></script>
<script src="/static/download.js"></script>
<script>
const STATES = {
  active:  { color: "var(--pb-live)",     tag: "tag-live",     label: "Live" },
  revoked: { color: "var(--pb-revoked)",  tag: "tag-revoked",  label: "Revoked" },
  expired: { color: "var(--pb-expiring)", tag: "tag-expiring", label: "Expired" },
  scan_cap_reached: { color: "var(--pb-revoked)", tag: "tag-revoked", label: "Scan cap reached" },
};

let page = 0;


/* One code, every control in one place — the same set the app shows: the picture,
   its scan history, editing, switching off, and deleting outright. Before this,
   the web could only revoke: label, expiry, scan cap and delete existed in the
   API and the app but had no way in from a browser. */
function openCodeSheet(c) {
  const live = c.state === "active";
  const modal = document.createElement("div");
  modal.id = "code-sheet";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(45,43,43,.55);"
    + "display:grid;place-items:center;padding:24px;z-index:70";
  modal.innerHTML = `
    <div class="code-card" style="--corner:${live ? "var(--pb-live)" : "var(--pb-revoked)"};
        width:min(460px,100%);max-height:86vh;overflow:auto">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span>
      <div style="display:flex;align-items:center;gap:12px">
        <p class="mono" style="font-size:13px;font-weight:700;margin:0;flex:1;overflow-wrap:anywhere">
          ${c.opaque_resolution_id}</p>
        <span class="tag ${live ? "tag-live" : "tag-revoked"}">${live ? "Live" : c.state}</span>
      </div>
      <p class="mono muted" style="font-size:10.5px;margin:0">
        ${c.label || "unlabelled"} · ${c.scan_count} scans · decode ${c.decode_rate}%</p>
      <img src="/v1/photos/${c.photo_id}.png" alt="" style="width:100%;background:#fff;
        ${live ? "" : "opacity:.5"}">

      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a class="btn btn-primary" href="/v1/photos/${c.photo_id}.png"
           download="identity-${c.opaque_resolution_id}.png">Download PNG</a>
        <button class="btn btn-secondary" id="cs-copy">Copy link</button>
        <a class="btn btn-ghost" href="/r/${c.opaque_resolution_id}"
           target="_blank" rel="noopener">Public page</a>
      </div>

      ${live ? `
      <button class="btn btn-secondary" id="cs-edit">Edit this copy</button>
      <div id="cs-editor" hidden style="display:grid;gap:12px">
        <div class="field"><label for="cs-label">Label</label>
          <input id="cs-label" class="input" value="${(c.label || "").replace(/"/g, "&quot;")}"></div>
        <div class="field"><label for="cs-cap">Stop working after this many scans</label>
          <input id="cs-cap" class="input" inputmode="numeric"
                 placeholder="leave empty for no limit"
                 value="${c.max_scans || ""}"></div>
        <div class="field"><label for="cs-days">Stop working in this many days</label>
          <input id="cs-days" class="input" inputmode="numeric"
                 placeholder="leave empty for no expiry"></div>
        <button class="btn btn-primary" id="cs-save">Save changes</button>
      </div>` : `
      <p class="mono muted" style="font-size:11px;margin:0">this copy is switched off —
        scanning it says so, and nothing is decrypted</p>`}

      <div class="mono muted" style="border-top:1px solid rgba(32,30,29,.18);padding-top:12px;
          font-size:10.5px;line-height:1.7">
        ${(c.log || []).map(l => `<div>${l}</div>`).join("") || "<div>no scans yet</div>"}
      </div>

      <div style="display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(32,30,29,.18);padding-top:12px">
        ${live ? `<button class="btn btn-secondary" id="cs-revoke"
          style="border-color:var(--pb-revoked);color:var(--pb-revokedInk)">Switch this copy off</button>` : ""}
        <button class="btn btn-secondary" id="cs-delete"
          style="border-color:var(--pb-revoked);color:var(--pb-revokedInk)">Delete this code</button>
        <button class="btn btn-primary" id="cs-done" style="margin-left:auto">Done</button>
      </div>
      <p class="mono muted" style="font-size:10.5px;margin:0">deleting removes the picture
        and this code; copies already shared are told they've been switched off</p>
    </div>`;
  document.body.appendChild(modal);

  const close = () => modal.remove();
  const $$ = (id) => modal.querySelector("#" + id);
  $$("cs-done").onclick = close;
  modal.addEventListener("click", (e) => { if (e.target === modal) close(); });

  $$("cs-copy").onclick = () => {
    navigator.clipboard?.writeText(location.origin + "/r/" + c.opaque_resolution_id);
    toast("Link copied");
  };

  if ($$("cs-edit")) {
    $$("cs-edit").onclick = () => {
      const box = $$("cs-editor");
      box.hidden = !box.hidden;
      $$("cs-edit").textContent = box.hidden ? "Edit this copy" : "Done editing";
    };
    $$("cs-save").onclick = async () => {
      const done = withSpinner($$("cs-save"), "Saving");
      const days = parseInt($$("cs-days").value, 10);
      const body = {
        label: $$("cs-label").value.trim(),
        max_scans: parseInt($$("cs-cap").value, 10) || 0,
        expires_at: Number.isFinite(days) && days > 0
          ? new Date(Date.now() + days * 86400000).toISOString() : "",
      };
      try {
        await api(`/v1/shares/${c.share_id}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        toast("Saved");
        close(); load();
      } catch (e) { done(); toast(e.message); }
    };
  }

  if ($$("cs-revoke")) {
    $$("cs-revoke").onclick = async () => {
      const ok = await confirmAction({
        title: "Switch this copy off?",
        body: "The next scan of this copy will show Revoked. Other copies of the "
            + "same photo keep working. This cannot be undone.",
        confirmLabel: "Switch off", destructive: true,
      });
      if (!ok) return;
      const done = withSpinner($$("cs-revoke"), "Switching off");
      try {
        await api("/v1/shares/" + c.share_id, { method: "DELETE" });
        toast("Revoked"); close(); load();
      } catch (e) { done(); toast(e.message); }
    };
  }

  $$("cs-delete").onclick = async () => {
    const ok = await confirmAction({
      title: "Delete this code?",
      body: "The picture and this code are removed and cannot be recovered. "
          + "Anyone scanning a copy is told it has been switched off. Your monthly "
          + "count is not reduced.",
      confirmLabel: "Delete", destructive: true, requireText: "DELETE",
    });
    if (!ok) return;
    const done = withSpinner($$("cs-delete"), "Deleting");
    try {
      await api("/v1/codes/" + c.credential_id, { method: "DELETE" });
      toast("Deleted"); close(); load();
    } catch (e) { done(); toast(e.message); }
  };
}

window.load = async function load() {
  const me = await requireAuth();
  if (!me) return;
  const data = await api("/v1/codes");
  document.getElementById("count").textContent = data.count + " instances";
  document.getElementById("empty").hidden = data.count > 0;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  // Paged, so a long list stays a list rather than an endless scroll. The page
  // survives a reload of the same data, which matters because live updates call
  // load() again and losing your place mid-review would be worse than useless.
  const PER_PAGE = 9;
  const pages = Math.max(1, Math.ceil(data.codes.length / PER_PAGE));
  if (page >= pages) page = pages - 1;
  const shown = data.codes.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
  for (const c of shown) {
    const st = STATES[c.state] || STATES.active;
    const card = document.createElement("div");
    card.className = "code-card";
    card.style.setProperty("--corner", st.color);
    card.innerHTML = `
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span>
      <div style="display:flex;gap:12px">
        <img src="/v1/photos/${c.photo_id}.png" alt="" width="88" height="88"
             style="flex:none;background:#fff;object-fit:cover;${c.state !== "active" ? "opacity:.45" : ""}">
        <div style="min-width:0">
          <p class="mono" style="font-size:13px;font-weight:700;margin:0 0 6px;overflow-wrap:anywhere">${c.opaque_resolution_id}</p>
          <span class="tag ${st.tag}">${st.label}</span>
          <p style="font-size:11px;color:var(--pb-muted);margin:6px 0 0">${c.label} · ${c.scan_count} scans · decode ${c.decode_rate}%</p>
        </div>
      </div>
      <div class="mono muted" style="border-top:1px solid rgba(32,30,29,.4);padding-top:12px;font-size:10.5px;line-height:1.7">
        ${c.log.map(l => `<div>${l}</div>`).join("") || "<div>no scans yet</div>"}
      </div>
      <div style="display:flex;gap:12px;margin-top:auto">
        <button class="btn btn-secondary" data-open="${c.share_id}">Open</button>
        <a class="btn btn-ghost" href="/r/${c.opaque_resolution_id}" target="_blank" rel="noopener">Public page</a>
      </div>`;
    grid.appendChild(card);
  }
  const pager = document.getElementById("pager");
  pager.hidden = pages < 2;
  if (pages > 1) {
    pager.innerHTML = `
      <button class="btn btn-secondary" id="prev" ${page === 0 ? "disabled" : ""}>Previous</button>
      <span class="mono muted" style="font-size:11px">page ${page + 1} of ${pages}</span>
      <button class="btn btn-secondary" id="next" ${page >= pages - 1 ? "disabled" : ""}>Next</button>`;
    document.getElementById("prev").onclick = () => { page--; load(); };
    document.getElementById("next").onclick = () => { page++; load(); };
  }

  grid.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
    const code = data.codes.find(x => x.share_id === b.dataset.open);
    if (code) openCodeSheet(code);
  }));

  grid.querySelectorAll("[data-revoke]").forEach(b => b.addEventListener("click", async () => {
    const ok = await confirmAction({
      title: "Revoke this share?",
      body: "The next scan of this copy will show Revoked. Other shares of the "
          + "same photo keep working. This cannot be undone.",
      confirmLabel: "Revoke", destructive: true,
    });
    if (!ok) return;
    const done = withSpinner(b, "Revoking");
    try {
      await api("/v1/shares/" + b.dataset.revoke, { method: "DELETE" });
      toast("Revoked");
      load();
    } catch (e) { done(); toast(e.message); }
  }));
}
load();
</script>
<script src="/static/legal.js"></script>
<script src="/static/feedback.js"></script>
<script src="/static/sync.js"></script>
</body>
</html>
